<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2c3e50">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Task Board">
<title>Task Board</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css?v=f54e14d2">
</head>
<body data-space="personal">

<header class="head">
  <div class="head-top">
    <div class="brand">
      <svg class="logo" viewBox="0 0 64 64" width="22" height="22" aria-hidden="true">
        <rect x="4" y="4" width="56" height="56" rx="12" fill="#f7f4ee"/>
        <rect x="14" y="17" width="9" height="9" rx="2.5" fill="none" stroke="#5b93b8" stroke-width="3"/>
        <path d="M15.5 21.5l2.5 2.5 4-5" fill="none" stroke="#5b93b8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="28" y="19" width="22" height="5" rx="2.5" fill="#5b93b8"/>
        <rect x="14" y="38" width="9" height="9" rx="2.5" fill="none" stroke="#c98a4b" stroke-width="3"/>
        <rect x="28" y="40" width="22" height="5" rx="2.5" fill="#c98a4b"/>
      </svg>
      <span>Task&nbsp;Board</span>
    </div>
    <div id="syncBar" class="syncbar" title="同期の様子"></div>
    <button type="button" class="gear" id="setBtn" aria-label="設定">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
        <path fill="currentColor" d="M12 8.5A3.5 3.5 0 1 0 12 15.5 3.5 3.5 0 0 0 12 8.5Zm0 5.5a2 2 0 1 1 0-4 2 2 0 0 1 0 4Z"/>
        <path fill="currentColor" d="m19.4 13-.1-1 .1-1 1.6-1.2a.6.6 0 0 0 .2-.8l-1.6-2.7a.6.6 0 0 0-.7-.3l-1.9.7a6.9 6.9 0 0 0-1.7-1l-.3-2a.6.6 0 0 0-.6-.5h-3.2a.6.6 0 0 0-.6.5l-.3 2a6.9 6.9 0 0 0-1.7 1l-1.9-.7a.6.6 0 0 0-.7.3L4.4 9a.6.6 0 0 0 .2.8L6.2 11l-.1 1 .1 1-1.6 1.2a.6.6 0 0 0-.2.8l1.6 2.7c.1.3.4.4.7.3l1.9-.7c.5.4 1.1.8 1.7 1l.3 2c0 .3.3.5.6.5h3.2c.3 0 .6-.2.6-.5l.3-2c.6-.2 1.2-.6 1.7-1l1.9.7c.3.1.6 0 .7-.3l1.6-2.7a.6.6 0 0 0-.2-.8L19.4 13Zm-1.6 3.6-1.6-.6-.7.6c-.4.3-.9.6-1.4.8l-.9.3-.3 1.7h-1.8l-.3-1.7-.9-.3c-.5-.2-1-.5-1.4-.8l-.7-.6-1.6.6-.9-1.5 1.4-1 -.1-.9a5.6 5.6 0 0 1 0-1.6l.1-.9-1.4-1 .9-1.5 1.6.6.7-.6c.4-.3.9-.6 1.4-.8l.9-.3.3-1.7h1.8l.3 1.7.9.3c.5.2 1 .5 1.4.8l.7.6 1.6-.6.9 1.5-1.4 1 .1.9a5.6 5.6 0 0 1 0 1.6l-.1.9 1.4 1-.9 1.5Z"/>
      </svg>
    </button>
  </div>

  <!-- 個人と会社の切り替え。★中身も送り先も別々です（js/store.js） -->
  <div class="space" id="spaceSwitch" role="tablist" aria-label="個人と会社の切り替え">
    <button type="button" class="sp on" data-space="personal" role="tab">個人</button>
    <button type="button" class="sp" data-space="work" role="tab">会社</button>
  </div>

  <nav class="tabs" id="tabs">
    <button type="button" class="tab on" data-view="task">タスク <span class="cnt" id="cntTask"></span></button>
    <button type="button" class="tab" data-view="memo">メモ <span class="cnt" id="cntMemo"></span></button>
  </nav>
</header>

<main>

  <!-- ============ タスク ============ -->
  <section id="view-task" class="view on">
    <form class="addbar" id="taskForm" autocomplete="off">
      <input type="text" id="taskInput" enterkeyhint="done" aria-label="タスクを足す">
      <button type="submit" class="addgo" aria-label="足す">＋</button>
    </form>
    <div class="rule" id="taskRule"></div>
    <div id="taskList"></div>
  </section>

  <!-- ============ メモ ============ -->
  <section id="view-memo" class="view">
    <form class="memoadd" id="memoForm" autocomplete="off">
      <textarea id="memoInput" rows="2" maxlength="10000" aria-label="メモを書く"></textarea>
      <button type="submit" class="mini go">残す</button>
    </form>
    <div class="rule" id="memoRule"></div>
    <div id="memoList"></div>
  </section>

  <!-- ============ 設定 ============ -->
  <section id="view-set" class="view">
    <div id="setBody"></div>
  </section>

</main>

<div class="modal-wrap" id="modalWrap" hidden>
  <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="js/config.js?v=f54e14d2"></script>
<script src="js/store.js?v=f54e14d2"></script>
<script src="js/sync.js?v=f54e14d2"></script>
<script src="js/app.js?v=f54e14d2"></script>
</body>
</html>
